# Builds only the Google Play file (AAB) and attaches it to a GitHub Release:
#   Rich-CV-Maker.aab  -> upload to Google Play
#   mapping.txt        -> R8 mapping (Play also reads it from the AAB)
# Works with the zip uploaded as-is, or with its files unzipped (folder android-app).
name: Build Play AAB

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the app
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          REAL=$(find . -path '*/android-app/settings.gradle' -not -path '*/test-build/*' -not -path './.git/*' | head -n 1)
          if [ -z "$REAL" ]; then echo "android-app folder not found"; exit 1; fi
          echo "REALDIR=$(dirname "$REAL")" >> "$GITHUB_ENV"
          echo "App: $(dirname "$REAL")"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the AAB for Google Play
        run: |
          cd "$REALDIR"
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Rich-CV-Maker.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/mapping.txt" || true

      - name: If the build failed, show what R8 is missing
        if: failure()
        run: |
          for f in $(find . -path '*outputs/mapping/release/missing_rules.txt'); do echo "===== $f (send this to Claude) ====="; cat "$f"; done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-${{ github.run_number }}
          name: Rich CV Maker AAB ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            Rich-CV-Maker.aab
            mapping.txt
