# Builds everything in one run and attaches it to one GitHub Release:
#   Rich-CV-Maker.aab       -> upload to Google Play
#   Rich-CV-Maker-TEST.apk  -> test build ("qwerty" Pro password, test ads) - never upload this to Play
#   mapping.txt             -> R8 mapping (Play also reads it from the AAB)
# Works with only the test app too (a zip with just test-build).
# Works with the zip uploaded as-is, or with its files unzipped (folders android-app and test-build/android-app).
name: Build all (Play AAB + TEST APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the projects
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          REAL=$(find . -path '*/android-app/settings.gradle' -not -path '*/test-build/*' -not -path './.git/*' | head -n 1)
          TEST=$(find . -path '*/test-build/android-app/settings.gradle' -not -path './.git/*' | head -n 1)
          if [ -z "$REAL" ] && [ -z "$TEST" ]; then echo "android-app folder not found"; exit 1; fi
          if [ -n "$REAL" ]; then echo "REALDIR=$(dirname "$REAL")" >> "$GITHUB_ENV"; fi
          if [ -n "$TEST" ]; then echo "TESTDIR=$(dirname "$TEST")" >> "$GITHUB_ENV"; fi
          echo "Real app: $(dirname "$REAL")   Test app: ${TEST:-not found}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the real app (AAB for Play only)
        if: env.REALDIR != ''
        run: |
          cd "$REALDIR"
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Rich-CV-Maker.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/mapping.txt" || true

      - name: Build the TEST app (APK only)
        if: env.TESTDIR != ''
        run: |
          cd "$TESTDIR"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Rich-CV-Maker-TEST.apk"

      - name: If the build failed, show what R8 is missing
        if: failure()
        run: |
          for f in $(find . -path '*outputs/mapping/release/missing_rules.txt'); do echo "===== $f (send this to Claude) ====="; cat "$f"; done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rich CV Maker build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            Rich-CV-Maker.aab
            Rich-CV-Maker-TEST.apk
            mapping.txt
